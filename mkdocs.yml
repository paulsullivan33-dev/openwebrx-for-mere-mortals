site_name: OpenWebRX for Mere Mortals
site_description: Plain-language web software-defined radio. One receiver and one antenna shared by every browser on your network, with devices and profiles, the waterfall, bookmarks, users, background decoding, and an honest account of what one dongle cannot do.
